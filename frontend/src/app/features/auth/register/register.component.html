<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Create account</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Full name</mat-label>
          <input matInput formControlName="fullName" autocomplete="name" />
          <mat-error *ngIf="form.controls.fullName.hasError('required')">Name is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
          <mat-error *ngIf="form.controls.email.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="form.controls.email.hasError('email')">Enter a valid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="new-password" />
          <mat-error *ngIf="form.controls.password.hasError('required')">Password is required</mat-error>
          <mat-error *ngIf="form.controls.password.hasError('minlength')">Minimum 6 characters</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirm password</mat-label>
          <input matInput type="password" formControlName="confirmPassword" autocomplete="new-password" />
          <mat-error *ngIf="form.controls.confirmPassword.hasError('required')">Please confirm your password</mat-error>
        </mat-form-field>

        <p class="error" *ngIf="form.hasError('passwordMismatch') && form.controls.confirmPassword.touched">
          Passwords do not match
        </p>
        <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

        <button mat-flat-button color="primary" class="full-width" type="submit" [disabled]="submitting">
          {{ submitting ? 'Creating...' : 'Create account' }}
        </button>
      </form>
      <p class="register-link">
        Already have an account? <a routerLink="/login">Sign in</a>
      </p>
    </mat-card-content>
  </mat-card>
</div>
